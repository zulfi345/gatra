name: Build Gatra APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Gatra.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Gatra-APK
          path: out/Gatra.apk
          retention-days: 30
